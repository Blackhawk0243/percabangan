<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Robo-Code: Master Logika</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f0fdfa;
            --card-bg: #ffffff;
            --text: #1e293b;
            --code-bg: #1e1e2e;
            --code-text: #a6accd;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Container Utama */
        .app-container {
            width: 100%;
            max-width: 500px;
            height: 95vh;
            max-height: 850px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 4px solid #fff;
        }

        /* Screens Management */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--card-bg);
            transition: transform 0.4s ease-in-out;
            padding: 20px;
            z-index: 1;
        }

        .screen.hidden {
            transform: translateX(100%);
            z-index: 0;
        }

        .screen.active {
            transform: translateX(0);
        }

        .screen.left {
            transform: translateX(-100%);
        }

        /* Intro Screen */
        .intro-img {
            font-size: 6rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            color: var(--primary);
            font-size: 2.2rem;
            margin: 0;
            text-align: center;
            line-height: 1.2;
        }

        p {
            color: #64748b;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .btn-start {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: all 0.1s;
        }

        .btn-start:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* Game Screen Header */
        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f1f5f9;
        }

        .level-pill {
            background: #e0e7ff;
            color: var(--primary);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .score-pill {
            background: #fef3c7;
            color: #d97706;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* Visualization Area */
        .visual-stage {
            flex: 1;
            width: 100%;
            background: #f8fafc;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 15px;
            border: 2px dashed #cbd5e1;
            min-height: 180px;
        }

        .scene-emoji {
            font-size: 4rem;
            z-index: 2;
        }

        .robot-avatar {
            font-size: 2.5rem;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .condition-label {
            margin-top: 10px;
            font-weight: bold;
            color: #475569;
            background: white;
            padding: 5px 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 0.9rem;
            text-align: center;
        }

        /* Coding Area */
        .code-editor {
            width: 100%;
            background: var(--code-bg);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            color: var(--code-text);
            position: relative;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.3);
            font-size: 0.95rem;
        }

        .line {
            line-height: 1.6;
            white-space: nowrap;
        }

        .kw-if { color: #c678dd; font-weight: bold; } /* Ungu */
        .kw-else { color: #e06c75; font-weight: bold; } /* Merah */
        .kw-var { color: #e5c07b; } /* Kuning */
        .kw-func { color: #61afef; } /* Biru */
        .kw-val { color: #98c379; } /* Hijau */

        .answer-slot {
            display: inline-block;
            min-width: 110px;
            height: 28px;
            background: rgba(255,255,255,0.1);
            border: 2px dashed #5c6370;
            border-radius: 5px;
            color: #fff;
            text-align: center;
            line-height: 24px;
            padding: 0 5px;
            vertical-align: middle;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .answer-slot.filled {
            border: 2px solid var(--success);
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .answer-slot.wrong {
            border: 2px solid var(--danger);
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        /* Options Area */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .option-btn {
            background: white;
            border: 2px solid #e2e8f0;
            padding: 12px;
            border-radius: 12px;
            color: var(--text);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            box-shadow: 0 4px 0 #e2e8f0;
        }

        .option-btn:hover {
            background: #f8fafc;
            border-color: var(--primary);
            color: var(--primary);
        }

        .option-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* Feedback Modal */
        .feedback-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .feedback-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .feedback-icon {
            font-size: 5rem;
            margin-bottom: 10px;
        }

        .feedback-title {
            font-size: 2rem;
            font-family: 'Fredoka', sans-serif;
            margin-bottom: 10px;
        }

        .feedback-text {
            text-align: center;
            max-width: 80%;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .btn-next {
            background: var(--success);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #059669;
        }
        
        .btn-next:active { transform: translateY(5px); box-shadow: none; }

        /* Animations */
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } 100% { transform: translateX(0); } }
        .shake-anim { animation: shake 0.4s ease-in-out; }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            background: #f00;
            top: -10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Screen 1: Intro -->
    <div id="introScreen" class="screen active">
        <div class="intro-img">🤖</div>
        <h1>Master Logika<br>Level 5 SD</h1>
        <p>15 Tantangan Koding: If & Else<br>Siapkah kamu?</p>
        <button class="btn-start" onclick="startGame()">Mulai Misi ▶</button>
    </div>

    <!-- Screen 2: Game -->
    <div id="gameScreen" class="screen hidden">
        <div class="game-header">
            <div class="level-pill" id="levelIndicator">Level 1/15</div>
            <div class="score-pill" id="scoreIndicator">Benar: 0</div>
        </div>

        <!-- Visual Scene -->
        <div class="visual-stage">
            <div class="scene-emoji" id="sceneEmoji">🌧️</div>
            <div class="condition-label" id="conditionLabel">Cuaca sedang Hujan</div>
            <div class="robot-avatar" id="robotAvatar">🤖</div>
        </div>

        <!-- Code Editor (Isinya akan berubah dinamis via JS) -->
        <div class="code-editor" id="codeEditorArea">
            <!-- Dynamic Content -->
        </div>

        <!-- Options -->
        <div class="options-grid" id="optionsContainer">
            <!-- Buttons injected by JS -->
        </div>

        <!-- Feedback Overlay (Hidden by default) -->
        <div class="feedback-overlay" id="feedbackOverlay">
            <div class="feedback-icon" id="fbIcon">🎉</div>
            <h2 class="feedback-title" id="fbTitle">Hebat!</h2>
            <p class="feedback-text" id="fbText">Logikamu benar.</p>
            <button class="btn-next" onclick="nextLevel()">Lanjut Level ➡</button>
        </div>
    </div>

    <!-- Screen 3: Result -->
    <div id="resultScreen" class="screen hidden">
        <div style="font-size: 5rem; margin-bottom: 20px;">🏆</div>
        <h1>Misi Selesai!</h1>
        <p>Kamu telah menyelesaikan 15 level logika tingkat lanjut.</p>
        <div style="background: #f1f5f9; padding: 20px; border-radius: 15px; width: 100%; text-align: center; margin-bottom: 20px;">
            <h3 style="margin:0; color:#64748b;">Skor Akhir</h3>
            <h1 style="margin:10px 0; color:var(--primary); font-size: 3rem;" id="finalScore">100</h1>
        </div>
        <button class="btn-start" onclick="location.reload()">Main Lagi ↺</button>
    </div>

</div>

<script>
    /* --- DATA SOAL (15 LEVEL - HARDER) --- */
    /* slotPos: 'if' (mengisi blok IF), 'else' (mengisi blok ELSE) */
    const levels = [
        {
            id: 1,
            scene: "🌧️",
            desc: "Cuaca Hujan Deras",
            codeCond: "hujan == benar",
            slotPos: "if",
            fixedAction: "Main_Bola",
            options: [
                { text: "Pakai_Payung", correct: true },
                { text: "Siram_Tanaman", correct: false }
            ],
            feedbackOk: "Benar! Fokus pada kondisi IF (Jika Hujan).",
            feedbackNo: "Salah. Kalau hujan kita butuh payung."
        },
        {
            id: 2,
            scene: "🤤",
            desc: "Perut KENYANG (Tidak Lapar)",
            codeCond: "lapar == benar",
            slotPos: "else", /* Tantangan: Mengisi ELSE */
            fixedAction: "Makan_Nasi",
            options: [
                { text: "Minum_Obat", correct: false },
                { text: "Lanjut_Main", correct: true }
            ],
            feedbackOk: "Tepat! Karena TIDAK lapar (Else), kita bisa lanjut main.",
            feedbackNo: "Ups! Blok ELSE artinya kondisi 'lapar' itu SALAH (kenyang)."
        },
        {
            id: 3,
            scene: "🔋",
            desc: "Baterai Kritis (5%)",
            codeCond: "baterai < 10",
            slotPos: "if",
            fixedAction: "Main_Game",
            options: [
                { text: "Cari_Charger", correct: true },
                { text: "Nyalakan_Senter", correct: false }
            ],
            feedbackOk: "Pintar! Prioritas utama saat lowbat adalah charging.",
            feedbackNo: "Jangan nyalakan fitur lain, nanti mati total!"
        },
        {
            id: 4,
            scene: "🎓",
            desc: "Nilai Ujian: 80 (KKM: 75)",
            codeCond: "nilai < 75", /* Perhatikan logikanya: Jika Kurang dari 75 */
            slotPos: "else",
            fixedAction: "Remedial",
            options: [
                { text: "Naik_Kelas", correct: true },
                { text: "Nangis", correct: false }
            ],
            feedbackOk: "Hebat! 80 itu TIDAK kurang dari 75, jadi masuk blok ELSE (Naik Kelas).",
            feedbackNo: "Perhatikan tandanya '< 75'. Nilai 80 itu lebih besar, jadi masuk ELSE."
        },
        {
            id: 5,
            scene: "🚶",
            desc: "Lantai Basah & Licin",
            codeCond: "lantai == licin",
            slotPos: "if",
            fixedAction: "Lari_Kencang",
            options: [
                { text: "Jalan_Pelan", correct: true },
                { text: "Lompat_Tali", correct: false }
            ],
            feedbackOk: "Safety First! Kalau licin harus hati-hati.",
            feedbackNo: "Bahaya! Jangan aktivitas berat di lantai licin."
        },
        {
            id: 6,
            scene: "📩",
            desc: "Tidak Ada Pesan Masuk",
            codeCond: "ada_pesan == benar",
            slotPos: "else",
            fixedAction: "Baca_Pesan",
            options: [
                { text: "Balas_Chat", correct: false },
                { text: "Tunggu", correct: true }
            ],
            feedbackOk: "Benar. Karena tidak ada pesan (Else), kita menunggu saja.",
            feedbackNo: "Tidak ada pesan kok mau balas chat? :)"
        },
        {
            id: 7,
            scene: "🚦",
            desc: "Lampu Hijau Menyala",
            codeCond: "lampu == hijau",
            slotPos: "if",
            fixedAction: "Berhenti",
            options: [
                { text: "Menyeberang", correct: true },
                { text: "Tidur_di_Jalan", correct: false }
            ],
            feedbackOk: "Bagus! Hijau waktunya pejalan kaki menyeberang.",
            feedbackNo: "Waduh bahaya sekali!"
        },
        {
            id: 8,
            scene: "🚪",
            desc: "Ada Tamu Mengetuk",
            codeCond: "ada_tamu == benar",
            slotPos: "if",
            fixedAction: "Kunci_Pintu",
            options: [
                { text: "Buka_Pintu", correct: true },
                { text: "Teriak", correct: false }
            ],
            feedbackOk: "Sopan santun! Ada tamu harus dibukakan pintu.",
            feedbackNo: "Jangan teriak, nanti tamunya kaget."
        },
        {
            id: 9,
            scene: "💰",
            desc: "Uang Kurang (Harga 10rb, Uang 5rb)",
            codeCond: "uang >= harga",
            slotPos: "else",
            fixedAction: "Beli_Barang",
            options: [
                { text: "Menabung", correct: true },
                { text: "Ambil_Paksa", correct: false }
            ],
            feedbackOk: "Bijak! Kalau uang kurang (Else), tabung dulu.",
            feedbackNo: "Tidak boleh mengambil barang tanpa membayar!"
        },
        {
            id: 10,
            scene: "☀️",
            desc: "Cuaca Sangat Panas",
            codeCond: "suhu > 30",
            slotPos: "if",
            fixedAction: "Pakai_Jaket",
            options: [
                { text: "Nyalakan_AC", correct: true },
                { text: "Jemur_Diri", correct: false }
            ],
            feedbackOk: "Adem! AC membantu mendinginkan suhu panas.",
            feedbackNo: "Nanti kepanasan kalau jemur diri."
        },
        {
            id: 11,
            scene: "⏰",
            desc: "Jam 06:00 Pagi",
            codeCond: "pagi == benar",
            slotPos: "if",
            fixedAction: "Tidur_Lagi",
            options: [
                { text: "Bangun_Pagi", correct: true },
                { text: "Nonton_TV", correct: false }
            ],
            feedbackOk: "Semangat pagi! Waktunya bangun.",
            feedbackNo: "Jangan nonton TV pagi-pagi, siap-siap sekolah dulu."
        },
        {
            id: 12,
            scene: "🦷",
            desc: "Gigi Sehat (Tidak Sakit)",
            codeCond: "sakit_gigi == benar",
            slotPos: "else",
            fixedAction: "Ke_Dokter",
            options: [
                { text: "Makan_Apel", correct: true },
                { text: "Cabut_Gigi", correct: false }
            ],
            feedbackOk: "Enak! Kalau tidak sakit (Else), bisa makan apel renyah.",
            feedbackNo: "Gigi sehat kok mau dicabut?"
        },
        {
            id: 13,
            scene: "🔒",
            desc: "Password Benar",
            codeCond: "password_ok == benar",
            slotPos: "if",
            fixedAction: "Alarm_Bunyi",
            options: [
                { text: "Buka_Kunci", correct: true },
                { text: "Lapor_Polisi", correct: false }
            ],
            feedbackOk: "Akses diterima! Kunci terbuka.",
            feedbackNo: "Kenapa lapor polisi? Passwordnya kan benar."
        },
        {
            id: 14,
            scene: "👾",
            desc: "Nyawa Masih Ada (Nyawa = 3)",
            codeCond: "nyawa == 0",
            slotPos: "else",
            fixedAction: "Game_Over",
            options: [
                { text: "Lanjut_Main", correct: true },
                { text: "Menangis", correct: false }
            ],
            feedbackOk: "Gaspol! Nyawa tidak 0 (Else), jadi game belum berakhir.",
            feedbackNo: "Jangan menyerah, nyawa masih ada!"
        },
        {
            id: 15,
            scene: "🦠",
            desc: "Virus Komputer Terdeteksi!",
            codeCond: "ada_virus == benar",
            slotPos: "if",
            fixedAction: "Aman",
            options: [
                { text: "Scan_Antivirus", correct: true },
                { text: "Matikan_Layar", correct: false }
            ],
            feedbackOk: "Misi Selesai! Keamanan komputer terjaga.",
            feedbackNo: "Mematikan layar tidak menghapus virusnya!"
        }
    ];

    /* --- GAME LOGIC --- */
    let currentLevelIndex = 0;
    let correctCount = 0;
    
    // Elements
    const introScreen = document.getElementById('introScreen');
    const gameScreen = document.getElementById('gameScreen');
    const resultScreen = document.getElementById('resultScreen');
    
    const sceneEmoji = document.getElementById('sceneEmoji');
    const conditionLabel = document.getElementById('conditionLabel');
    const codeEditorArea = document.getElementById('codeEditorArea');
    const optionsContainer = document.getElementById('optionsContainer');
    const robotAvatar = document.getElementById('robotAvatar');
    const feedbackOverlay = document.getElementById('feedbackOverlay');
    let currentAnswerSlot = null; // Will store the dynamic DOM element

    function startGame() {
        currentLevelIndex = 0;
        correctCount = 0;
        introScreen.classList.add('left'); 
        gameScreen.classList.remove('hidden'); 
        setTimeout(() => {
            introScreen.classList.add('hidden');
            gameScreen.classList.add('active');
            loadLevel();
        }, 100);
    }

    function loadLevel() {
        if(currentLevelIndex >= levels.length) {
            endGame();
            return;
        }

        const data = levels[currentLevelIndex];

        // Update UI Info
        document.getElementById('levelIndicator').innerText = `Level ${data.id}/15`;
        document.getElementById('scoreIndicator').innerText = `Skor: ${correctCount * 10}`;
        
        sceneEmoji.innerText = data.scene;
        conditionLabel.innerText = data.desc;
        robotAvatar.innerText = "🤖";
        robotAvatar.style.transform = "scale(1)";

        // Hide Feedback
        feedbackOverlay.classList.remove('show');

        // --- DYNAMIC CODE RENDERING ---
        // Kita bangun HTML code editor berdasarkan posisi slot (IF atau ELSE)
        let htmlCode = '';

        htmlCode += `<div class="line"><span class="kw-if">JIKA</span> (<span class="kw-var">${data.codeCond}</span>) {</div>`;
        
        // Blok IF
        htmlCode += `<div class="line" style="padding-left: 20px;">`;
        if (data.slotPos === 'if') {
            htmlCode += `<span class="kw-func">lakukan</span>(<span id="dynamicSlot" class="answer-slot">???</span>);`;
        } else {
            htmlCode += `<span class="kw-func">lakukan</span>(<span class="kw-val">${data.fixedAction}</span>);`;
        }
        htmlCode += `</div>`;

        // Blok ELSE
        htmlCode += `<div class="line">} <span class="kw-else">JIKA TIDAK</span> {</div>`;
        htmlCode += `<div class="line" style="padding-left: 20px;">`;
        if (data.slotPos === 'else') {
            htmlCode += `<span class="kw-func">lakukan</span>(<span id="dynamicSlot" class="answer-slot">???</span>);`;
        } else {
            htmlCode += `<span class="kw-func">lakukan</span>(<span class="kw-val">${data.fixedAction}</span>);`;
        }
        htmlCode += `</div>`;
        htmlCode += `<div class="line">}</div>`;

        codeEditorArea.innerHTML = htmlCode;
        
        // Simpan referensi ke slot jawaban yang baru dibuat
        currentAnswerSlot = document.getElementById('dynamicSlot');

        // Generate Buttons (Shuffle)
        optionsContainer.innerHTML = '';
        const shuffledOptions = [...data.options].sort(() => Math.random() - 0.5);
        
        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => checkAnswer(opt, data);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedOption, levelData) {
        // Update slot text
        if(currentAnswerSlot) {
            currentAnswerSlot.innerText = selectedOption.text;
        }
        
        if (selectedOption.correct) {
            handleCorrect(levelData);
        } else {
            handleWrong(levelData);
        }
    }

    function handleCorrect(data) {
        if(currentAnswerSlot) currentAnswerSlot.classList.add('filled');
        correctCount++;
        
        robotAvatar.style.transform = "translateY(-20px) scale(1.2)";
        robotAvatar.innerText = "🤩";
        
        showFeedback(true, data.feedbackOk);
        createConfetti();
    }

    function handleWrong(data) {
        if(currentAnswerSlot) currentAnswerSlot.classList.add('wrong');
        
        robotAvatar.innerText = "😵";
        const visualStage = document.querySelector('.visual-stage');
        visualStage.classList.add('shake-anim');
        setTimeout(() => visualStage.classList.remove('shake-anim'), 500);

        showFeedback(false, data.feedbackNo);
    }

    function showFeedback(isSuccess, message) {
        const title = document.getElementById('fbTitle');
        const icon = document.getElementById('fbIcon');
        const text = document.getElementById('fbText');
        const btn = document.querySelector('.btn-next');

        if(isSuccess) {
            title.innerText = "Hebat!";
            title.style.color = "var(--success)";
            icon.innerText = "🎉";
            btn.style.background = "var(--success)";
            btn.innerText = "Lanjut Level ➡";
        } else {
            title.innerText = "Kurang Tepat";
            title.style.color = "var(--danger)";
            icon.innerText = "🔧";
            btn.style.background = "var(--primary)";
            btn.innerText = "Coba Level Berikutnya ➡";
        }

        text.innerText = message;
        
        setTimeout(() => {
            feedbackOverlay.classList.add('show');
        }, 600);
    }

    function nextLevel() {
        currentLevelIndex++;
        loadLevel();
    }

    function endGame() {
        gameScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        setTimeout(() => resultScreen.classList.add('active'), 100);
        
        const finalScore = Math.round((correctCount / levels.length) * 100);
        document.getElementById('finalScore').innerText = finalScore;
        
        if(finalScore > 80) {
            createConfetti();
            setTimeout(createConfetti, 500);
        }
    }

    /* --- UTILS: CONFETTI EFFECT --- */
    function createConfetti() {
        const colors = ['#ec4899', '#6366f1', '#10b981', '#f59e0b'];
        for (let i = 0; i < 40; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + 'vw';
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.animation = `fall ${Math.random() * 2 + 1}s linear forwards`;
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 3000);
        }
    }

    const styleSheet = document.createElement("style");
    styleSheet.innerText = `
        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    `;
    document.head.appendChild(styleSheet);

</script>

</body>
</html>
